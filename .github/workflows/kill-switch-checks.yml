name: Kill switch checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 gettext
      - run: ./tests/check.sh
      - run: msgfmt --check-format -o /dev/null luci-app-passwall2/po/zh-cn/passwall2.po
